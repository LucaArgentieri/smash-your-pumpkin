  <body>
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="label"><span class="text">lighting the candles</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
    <script>
      // Dots tick before any module has loaded; stops when the loader is gone.
      (function () {
        var step = 0;
        var timer = setInterval(function () {
          var dots = document.querySelectorAll("#loader .dots span");
          if (!dots.length) return clearInterval(timer);
          step = (step + 1) % 4;
          for (var i = 0; i < dots.length; i++) dots[i].style.visibility = i < step ? "visible" : "hidden";
        }, 380);
      })();
