<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07030c" />
    <title>Smash Your Pumpkin</title>
    <meta name="description" content="A Halloween rage room: smash as many pumpkins as you can in 60 seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smash Your Pumpkin" />
    <meta property="og:description" content="A Halloween rage room: smash as many pumpkins as you can in 60 seconds." />
    <meta property="og:url" content="https://lucaargentieri.github.io/smash-your-pumpkin/" />
    <meta property="og:image" content="https://lucaargentieri.github.io/smash-your-pumpkin/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lucaargentieri.github.io/smash-your-pumpkin/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Jacquard+24&family=Pixelify+Sans:wght@400;700&display=block"
      rel="stylesheet"
    />
    <style>
      /* Shown by the HTML itself, before any JavaScript, WebGL or physics has
         loaded; src/core/loader.js reports progress and removes it. */
      html, body { background: #07030c; margin: 0; }
      #loader {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; background: #07030c;
        font-family: "Pixelify Sans", monospace; color: #b79cff; transition: opacity 0.8s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader img {
        width: 96px; height: 96px; image-rendering: pixelated;
        /* The icon PNG has a black background: let it vanish into the page. */
        mix-blend-mode: lighten;
        filter: drop-shadow(0 0 18px rgba(255, 120, 30, 0.55));
        animation: flicker 2.2s infinite steps(1);
      }
      #loader .bar { width: min(260px, 60vw); height: 8px; background: #1c0a12; border: 2px solid #3b1650; }
      #loader .fill {
        height: 100%; width: 0; background: linear-gradient(90deg, #ff3a0a, #ffb347);
        box-shadow: 0 0 12px #ff5a14; transition: width 0.35s ease;
      }
      #loader .label { font-size: 14px; letter-spacing: 0.08em; text-transform: lowercase; min-height: 1em; }
      @keyframes flicker {
        0%, 100% { opacity: 1; } 12% { opacity: 0.82; } 14% { opacity: 1; } 47% { opacity: 0.9; }
        49% { opacity: 1; } 71% { opacity: 0.76; } 73% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { #loader img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <img src="/favicon.png" alt="" />
      <div class="bar"><div class="fill"></div></div>
      <div class="label">lighting the candles...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
