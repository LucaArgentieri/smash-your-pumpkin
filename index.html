<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07030c" />
    <title>Smash Your Pumpkin</title>
    <meta name="description" content="A Halloween rage room: smash as many pumpkins as you can in 60 seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smash Your Pumpkin" />
    <meta property="og:description" content="A Halloween rage room: smash as many pumpkins as you can in 60 seconds." />
    <meta property="og:url" content="https://lucaargentieri.github.io/smash-your-pumpkin/" />
    <meta property="og:image" content="https://lucaargentieri.github.io/smash-your-pumpkin/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lucaargentieri.github.io/smash-your-pumpkin/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Jacquard+24&family=Pixelify+Sans:wght@400;700&display=block"
      rel="stylesheet"
    />
    <style>
      /* Shown by the HTML itself, before any JavaScript, WebGL or physics has
         loaded; src/core/loader.js reports progress and removes it. */
      html, body { background: #07030c; margin: 0; }
      #loader {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px; padding: 0 16px; background: #07030c;
        transition: opacity 0.8s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      /* Same gothic face and ember glow as the in-game titles. */
      #loader .label {
        font: 700 clamp(26px, 7vw, 44px) "Grenze Gotisch", serif; text-align: center;
        background: linear-gradient(#ffe9a8, #ff7a1a); -webkit-background-clip: text; background-clip: text;
        color: transparent; filter: drop-shadow(0 0 10px rgba(255, 74, 16, 0.7));
        animation: flicker 2.2s infinite steps(1); transition: opacity 0.25s ease;
      }
      #loader .label.swap { opacity: 0; }
      /* Chunky segmented bar: embers filling a charred slot. */
      #loader .bar {
        width: min(300px, 70vw); height: 14px; padding: 3px; background: #12060c;
        border: 2px solid #3b1650; box-shadow: 0 0 0 2px #07030c, 0 0 18px rgba(59, 22, 80, 0.6);
      }
      #loader .fill {
        height: 100%; width: 0; transition: width 0.35s steps(6);
        background: repeating-linear-gradient(90deg, #ff5a14 0 10px, #ffb347 10px 12px, transparent 12px 15px);
        filter: drop-shadow(0 0 6px #ff3a0a);
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; } 12% { opacity: 0.82; } 14% { opacity: 1; } 47% { opacity: 0.9; }
        49% { opacity: 1; } 71% { opacity: 0.76; } 73% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { #loader .label { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="label">lighting the candles...</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
