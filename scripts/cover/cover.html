<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Key art for README / social cards / favicon, an homage to the Inscryption cover.
         Rendered to PNG by scripts/render-cover.mjs. -->
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&display=block" rel="stylesheet" />
    <style>
      body { margin: 0; background: #000; }
      canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <canvas id="cover" width="1200" height="630"></canvas>
    <canvas id="favicon" width="32" height="32"></canvas>
    <canvas id="touch" width="180" height="180"></canvas>
    <script type="module">
      import { ICONS } from "/src/ui/icons.js";

      const INK = "#07020a";
      const REDS = ["#1c0303", "#2e0605", "#460a07", "#651109", "#86200d"];
      const ORANGE = "#ff8a1e";
      const GLOW = "#ffb347";

      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      function spiral(ctx, cx, cy, turns, radius, width) {
        ctx.beginPath();
        for (let t = 0; t <= 1; t += 0.01) {
          const a = t * turns * Math.PI * 2;
          const r = radius * t;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r * 0.85;
          t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.stroke();
      }

      /** Big looming jack-o'-lantern, cropped by the top edge, ribs in dark reds. */
      function pumpkin(ctx, cx, cy, rx, ry) {
        const ribs = 9;
        for (let i = ribs - 1; i >= 0; i--) {
          const offset = (i - (ribs - 1) / 2) / ((ribs - 1) / 2);
          const lobeX = cx + offset * rx * 0.72;
          const lobeW = rx * (0.36 - Math.abs(offset) * 0.08);
          const depth = 1 - Math.abs(offset);
          ctx.fillStyle = REDS[Math.min(4, Math.round(1 + depth * 3))];
          ctx.beginPath();
          ctx.ellipse(lobeX, cy, lobeW, ry * (0.84 + depth * 0.16), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = REDS[0];
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        // Brow ridges and carved sockets.
        ctx.fillStyle = REDS[0];
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(cx + side * rx * 0.33, cy + ry * 0.18, rx * 0.16, ry * 0.2, side * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        // Spiral eyes, glowing like Leshy's.
        ctx.shadowColor = GLOW;
        ctx.shadowBlur = 6;
        ctx.strokeStyle = ORANGE;
        spiral(ctx, cx - rx * 0.33, cy + ry * 0.18, 2.4, rx * 0.12, 2.2);
        spiral(ctx, cx + rx * 0.33, cy + ry * 0.18, 2.4, rx * 0.12, 2.2);
        ctx.shadowBlur = 0;
        // Nose and a jagged grin sinking behind the title.
        ctx.fillStyle = REDS[0];
        ctx.beginPath();
        ctx.moveTo(cx - rx * 0.06, cy + ry * 0.5);
        ctx.lineTo(cx, cy + ry * 0.36);
        ctx.lineTo(cx + rx * 0.06, cy + ry * 0.5);
        ctx.fill();
        ctx.beginPath();
        const mouthY = cy + ry * 0.66;
        ctx.moveTo(cx - rx * 0.5, mouthY);
        for (let i = 0; i <= 10; i++) {
          const x = cx - rx * 0.5 + (i * rx) / 10;
          ctx.lineTo(x, mouthY + (i % 2 ? 7 : 0) + Math.sin((i / 10) * Math.PI) * 10);
        }
        ctx.lineTo(cx + rx * 0.5, mouthY + 22);
        ctx.lineTo(cx - rx * 0.5, mouthY + 22);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 120, 30, 0.35)";
        for (let i = 0; i < 5; i++) ctx.fillRect(cx - rx * 0.4 + i * rx * 0.2, mouthY + 9, 3, 3);
      }

      function icon(ctx, name, x, y, pixel, color) {
        ctx.fillStyle = color;
        ICONS[name].forEach((row, j) =>
          [...row].forEach((c, i) => c === "#" && ctx.fillRect(x + i * pixel, y + j * pixel, pixel, pixel)),
        );
      }

      /** Dark red parchment card like the cover's STOAT, cropped by the bottom. */
      function card(ctx, cx, cy, w, h, angle, title, glyph, light) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.fillStyle = light ? REDS[2] : REDS[1];
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeStyle = REDS[0];
        ctx.lineWidth = 3;
        ctx.strokeRect(-w / 2 + 1.5, -h / 2 + 1.5, w - 3, h - 3);
        ctx.lineWidth = 1;
        ctx.strokeRect(-w / 2 + 6, -h / 2 + 22, w - 12, h * 0.5);
        ctx.fillStyle = light ? REDS[0] : "#140202";
        ctx.font = `700 ${Math.round(w * 0.16)}px "Grenze Gotisch"`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(title, 0, -h / 2 + 12);
        icon(ctx, glyph, -18, -h / 2 + 28, 3, light ? REDS[0] : "#140202");
        ctx.restore();
      }

      /** The purple ink line with a drop of blood under the title. */
      function inkLine(ctx, x0, x1, y) {
        ctx.strokeStyle = "#5b2a86";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = x0; x <= x1; x += 2) {
          const yy = y + Math.sin(x * 0.09) * 1.6;
          x === x0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
        }
        ctx.stroke();
        ctx.fillStyle = "#c2123a";
        ctx.beginPath();
        ctx.ellipse((x0 + x1) / 2, y + 1, 9, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect((x0 + x1) / 2 - 1, y + 2, 2, 6);
        ctx.fillRect((x0 + x1) / 2 - 2, y + 8, 4, 3);
      }

      function grit(ctx, w, h) {
        for (let i = 0; i < w * h * 0.04; i++) {
          ctx.fillStyle = `rgba(0,0,0,${0.15 + rand() * 0.35})`;
          ctx.fillRect(Math.floor(rand() * w), Math.floor(rand() * h), 1, 1);
        }
      }

      function cover() {
        // Painted at 400 x 210 and blown up 3x with no filtering: pixel art.
        const W = 400, H = 210;
        const low = document.createElement("canvas");
        low.width = W;
        low.height = H;
        const ctx = low.getContext("2d");
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        const vignette = ctx.createRadialGradient(W / 2, 60, 10, W / 2, 80, 230);
        vignette.addColorStop(0, "rgba(90, 12, 6, 0.55)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);

        pumpkin(ctx, W / 2, 30, 142, 74);
        // The face sinks into the dark towards the title, like Leshy's.
        const fade = ctx.createLinearGradient(0, 50, 0, 112);
        fade.addColorStop(0, "rgba(7, 2, 10, 0)");
        fade.addColorStop(1, "rgba(7, 2, 10, 0.95)");
        ctx.fillStyle = fade;
        ctx.fillRect(0, 50, W, 62);

        card(ctx, 96, 208, 92, 110, -0.13, "FIST", "fist", false);
        card(ctx, 304, 208, 92, 110, 0.13, "AXE", "axe", false);
        card(ctx, W / 2, 204, 112, 128, 0, "MALLET", "mallet", true);

        // Title with an ember glow, then the ink line and drop of blood.
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = '700 34px "Grenze Gotisch"';
        ctx.shadowColor = "#ff5a14";
        ctx.shadowBlur = 10;
        ctx.fillStyle = ORANGE;
        ctx.fillText("SMASH YOUR PUMPKIN", W / 2, 110);
        ctx.shadowBlur = 0;
        const gradient = ctx.createLinearGradient(0, 96, 0, 124);
        gradient.addColorStop(0, "#ffd27a");
        gradient.addColorStop(1, "#ff7a1a");
        ctx.fillStyle = gradient;
        ctx.fillText("SMASH YOUR PUMPKIN", W / 2, 110);
        inkLine(ctx, 120, 280, 130);

        grit(ctx, W, H);

        const out = document.getElementById("cover").getContext("2d");
        out.imageSmoothingEnabled = false;
        out.drawImage(low, 0, 0, 1200, 630);
      }

      /** 16 x 16 jack-o'-lantern with spiral eyes, for the tab. */
      function favicon(id, size) {
        const px = document.createElement("canvas");
        px.width = 16;
        px.height = 16;
        const c = px.getContext("2d");
        const map = [
          "......##........",
          ".......#........",
          "...########.....",
          "..##########....",
          ".############...",
          ".##o##o###o##...",
          "##ooo###ooo###..",
          "##o#o###o#o###..",
          "###############.",
          "##############..",
          "##x#x#x#x#x###..",
          "##xxxxxxxxx###..",
          ".############...",
          "..##########....",
          "...########.....",
          "................",
        ];
        const colors = { "#": "#c2410c", o: "#ffd36a", x: "#2a0503" };
        map.forEach((row, y) =>
          [...row].forEach((ch, x) => {
            if (ch === ".") return;
            c.fillStyle = y < 2 ? "#3d4a18" : colors[ch];
            c.fillRect(x + 1, y, 1, 1);
          }),
        );
        // Darker ribs.
        c.fillStyle = "rgba(60, 8, 4, 0.45)";
        for (const x of [5, 9]) for (let y = 3; y < 14; y++) if (c.getImageData(x, y, 1, 1).data[0] === 0xc2) c.fillRect(x, y, 1, 1);
        const out = document.getElementById(id).getContext("2d");
        out.imageSmoothingEnabled = false;
        out.drawImage(px, 0, 0, size, size);
      }

      await document.fonts.load('700 40px "Grenze Gotisch"');
      cover();
      favicon("favicon", 32);
      favicon("touch", 180);
      window.ready = true;
    </script>
  </body>
</html>
